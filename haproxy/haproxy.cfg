# HAProxy der Demo – Ports wie im Architekturbild des Kunden (20260908_MES_Server_Overview):
#   8090        → Core (HTTP), Pfad /mes/fileprocessing → FileProcessing
#   8095        → Singleton (beim Kunden SAP-IDOC-Interface)
#   50000-50004 → FileProcessing, TCP-Socket-Server (Kunde: 50000-50100)
#   8989        → Statistikseite (+ Prometheus-Endpunkt /metrics)
#
# ANNAHME: Die haproxy.cfg des Kunden liegt nicht vor. Timeouts und maxconn sind
# Demo-Werte. maxconn je Server sorgt dafür, dass HAProxy selbst eine Warteschlange
# bildet – ohne maxconn reicht HAProxy alles sofort an Tomcat durch.

global
    log stdout format raw local0
    maxconn 4096

# Docker-DNS: core2 gibt es nur mit Profil "core2". Ohne Container bleibt der Server im
# Zustand MAINT (nicht auflösbar), HAProxy startet trotzdem und nimmt ihn auf, sobald er da ist.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
    hold nx 10s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  120s
    timeout server  120s
    timeout queue   30s
    retries 2

# ─── HTTP ────────────────────────────────────────────────────────────────────
frontend mes_http
    bind *:8090
    acl ist_fileprocessing path_beg /mes/fileprocessing
    use_backend fileprocessing if ist_fileprocessing
    default_backend core

backend core
    balance roundrobin
    option  httpchk GET /mes/api/status
    http-check expect status 200
    # Beim Kunden: Applikationsserver 1 und 2. Wartung (S13): /mes/api/status antwortet 503,
    # nach 3 Fehlversuchen (15 s) ist der Server DOWN, laufende Requests laufen zu Ende.
    default-server check inter 5s fall 3 rise 2 maxconn 200 resolvers docker init-addr last,libc,none
    server core1 core:8080
    server core2 core2:8080

backend fileprocessing
    balance roundrobin
    option  httpchk GET /mes/api/status
    http-check expect status 200
    http-request replace-path /mes/fileprocessing(.*) /mes\1
    server fp1 fileprocessing:8080 check inter 5s fall 3 rise 2 maxconn 200

frontend mes_singleton
    bind *:8095
    default_backend singleton

backend singleton
    option  httpchk GET /mes/api/status
    http-check expect status 200
    server singleton1 singleton:8080 check inter 5s fall 3 rise 2 maxconn 200

# ─── TCP: Datei-Schnittstelle des FileProcessing ─────────────────────────────
frontend mes_sockets
    mode tcp
    option tcplog
    bind *:50000-50004
    timeout client 1h
    default_backend fileprocessing_sockets

backend fileprocessing_sockets
    mode tcp
    timeout server 1h
    # Port des Clients wird beibehalten (50000 → 50000, 50001 → 50001 …)
    server fp1 fileprocessing check port 50000 inter 10s

# ─── Statistik und Metriken ──────────────────────────────────────────────────
frontend stats
    bind *:8989
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    stats show-node

# Zweiter Statistik-Listener für das Portal (http://<host>:8080/haproxy).
# Die Statistikseite baut ihre Links aus "stats uri" – deshalb muss der Pfad
# dort derselbe sein wie im Portal, und das Präfix darf nicht abgeschnitten
# werden. Mit PORTAL_PFAD (.env, äußerer Reverse Proxy) steht dieser davor.
# Nur im Docker-Netz erreichbar, auf dem Host ist nichts veröffentlicht;
# Port 8989 bleibt dadurch unverändert.
frontend stats_portal
    bind *:8990
    http-request use-service prometheus-exporter if { path "${PORTAL_PFAD}/haproxy/metrics" }
    stats enable
    stats uri "${PORTAL_PFAD}/haproxy"
    stats refresh 5s
    stats show-legends
    stats show-node
