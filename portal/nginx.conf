# ═══════════════════════════════════════════════════════════════════════════
#  Portal der MES-Demo – ein Eingang (Port 8080) für alle Weboberflächen
# ═══════════════════════════════════════════════════════════════════════════
#
#  http://<host>:8080/            Übersichtsseite mit allen Links
#                   /frontend/    Laststeuerung (Szenarien starten)
#                   /grafana/     Grafana
#                   /prometheus/  Prometheus
#                   /haproxy      HAProxy-Statistik
#                   /cadvisor/    cAdvisor
#                   /alertmanager/ Alertmanager (Weiterleitung der Alarme)
#                   /admin/       ActiveMQ-Web-Konsole (admin / admin)
#                   /core/ …      Applikationsserver (…/core/mes/api/status)
#                   /lb/ …        über den HAProxy des Kunden-Aufbaus (:8090)
#                   /metriken/…   JMX-Exporter der Applikationsserver
#
#  Die Einzelports (3000, 9090, 8070, 8200 …) bleiben zusätzlich offen – das
#  Portal ist ein zweiter Weg, kein Ersatz. JMX (RMI) und Oracle sind kein
#  HTTP und lassen sich nicht über diesen Port führen.
#
#  Drei Arten, einen Dienst anzubinden:
#    1. Präfix abschneiden   proxy_pass mit / am Ende – für Dienste, die von
#       ihrem Pfad nichts wissen müssen (Applikationsserver, Prometheus mit
#       --web.route-prefix=/, Laststeuerung mit relativen Pfaden).
#    2. Präfix durchreichen  proxy_pass ohne / am Ende – für Dienste, die
#       selbst unter dem Unterpfad ausliefern (Grafana serve_from_sub_path,
#       cAdvisor -url_base_prefix, HAProxy stats uri, Alertmanager
#       --web.route-prefix, ActiveMQ-Konsole unter /admin).
#    3. Namensauflösung zur Laufzeit (resolver + Variable) – nur für die
#       optionalen Container Facade und core2, die meistens gar nicht laufen.
#       Ohne das würde nginx schon beim Start abbrechen, weil der Name nicht
#       auflösbar ist.

worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    log_format portal '$remote_addr "$request" -> $upstream_addr $status ${request_time}s';
    access_log /dev/stdout portal;

    # WebSockets: Grafana Live und die laufende Ausgabe der Laststeuerung
    map $http_upgrade $verbindung {
        default upgrade;
        ''      close;
    }

    # Docker-DNS – nur für die optionalen Container Facade und core2 (siehe Kopf)
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $verbindung;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    # Szenarien laufen minutenlang, die Ausgabe kommt häppchenweise
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering    off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        # Weiterleitungen relativ ausgeben ("/grafana/" statt "http://host:8080/grafana/"):
        # sonst würde nginx den Port aus "listen" nehmen und nicht den, unter dem
        # die Anfrage hereinkam (PORTAL_PORT kann abweichen).
        absolute_redirect off;
        # Ein hängender Applikationsserver soll die Übersichtsseite nicht mitreißen
        proxy_connect_timeout 5s;

        # ─── Übersichtsseite ────────────────────────────────────────────────
        location = / {
            try_files /index.html =404;
        }

        # ─── Laststeuerung (Weboberfläche der Szenarien) ────────────────────
        # Eigener Container im Host-Netz, deshalb über host.docker.internal.
        # Die Vue-Oberfläche lädt ihre Dateien relativ (vite base './') und
        # bildet die API-Adresse aus document.baseURI – sie funktioniert
        # dadurch unter /frontend/ genauso wie direkt unter :8070.
        location = /frontend { return 301 /frontend/; }
        location /frontend/ {
            proxy_pass http://host.docker.internal:8070/;
        }

        # ─── Grafana ────────────────────────────────────────────────────────
        # GF_SERVER_SERVE_FROM_SUB_PATH=true: Grafana liefert selbst unter
        # /grafana/ aus, das Präfix wird deshalb NICHT abgeschnitten.
        location = /grafana { return 301 /grafana/; }
        location /grafana/ {
            proxy_pass http://grafana:3000;
        }

        # ─── Prometheus ─────────────────────────────────────────────────────
        # Präfix abschneiden, ohne Prometheus umzukonfigurieren: seine
        # Oberfläche (Version 3) ermittelt das Präfix selbst aus der Adresse im
        # Browser und hängt es an alle API-Aufrufe und Links. Nur die
        # Weiterleitung von "/" auf "/query" kommt ohne Präfix zurück – die
        # korrigiert proxy_redirect. So bleibt :9090 unverändert nutzbar.
        location = /prometheus { return 301 /prometheus/; }
        location /prometheus/ {
            proxy_pass http://prometheus:9090/;
            proxy_redirect / /prometheus/;
        }

        # ─── HAProxy-Statistik ──────────────────────────────────────────────
        # Zweiter Statistik-Listener auf 8990 mit "stats uri /haproxy"; der
        # Workshop-Port 8989 bleibt dadurch unangetastet.
        location /haproxy {
            proxy_pass http://haproxy:8990;
        }

        # ─── cAdvisor (Container-Sicht) ─────────────────────────────────────
        # -url_base_prefix=/cadvisor, Präfix wird durchgereicht.
        location = /cadvisor { return 301 /cadvisor/; }
        location /cadvisor/ {
            proxy_pass http://cadvisor:8080;
        }

        # ─── Applikationsserver direkt ──────────────────────────────────────
        # /core/mes/api/status  →  core:8080/mes/api/status
        location = /core { return 301 /core/mes/api/status; }
        location /core/ {
            proxy_pass http://core:8080/;
        }

        location = /fileprocessing { return 301 /fileprocessing/mes/api/status; }
        location /fileprocessing/ {
            proxy_pass http://fileprocessing:8080/;
        }

        location = /singleton { return 301 /singleton/mes/api/status; }
        location /singleton/ {
            proxy_pass http://singleton:8080/;
        }

        # Facade läuft nur mit Profil "facade" (./start.sh kunde --facade) und
        # startet sich im OOM-Szenario dauernd neu – Name deshalb erst zur
        # Laufzeit auflösen und einen verständlichen Hinweis statt 502 liefern.
        location = /facade { return 301 /facade/mes/api/status; }
        location /facade/ {
            set $facade_ziel facade;
            rewrite ^/facade/(.*)$ /$1 break;
            proxy_pass http://$facade_ziel:8080;
            proxy_next_upstream off;
            error_page 502 503 504 = @facade_aus;
        }
        location @facade_aus {
            default_type text/plain; charset utf-8;
            return 200 "Der Facade-Container antwortet nicht.\n\nEntweder ist er nicht gestartet (./start.sh kunde --facade)\noder er wurde gerade wegen Heap > Container-Limit beendet (Szenario S09).\n";
        }

        # Zweiter Core nur mit Profil "core2" (./start.sh kunde --core2, Szenario S13)
        location = /core2 { return 301 /core2/mes/api/status; }
        location /core2/ {
            set $core2_ziel core2;
            rewrite ^/core2/(.*)$ /$1 break;
            proxy_pass http://$core2_ziel:8080;
            proxy_next_upstream off;
            error_page 502 503 504 = @core2_aus;
        }
        location @core2_aus {
            default_type text/plain; charset utf-8;
            return 200 "Der zweite Core antwortet nicht.\n\nEr läuft nur mit ./start.sh kunde --core2 (Szenario S13)\noder er ist gerade im Wartungsmodus (dann antwortet /mes/api/status mit 503).\n";
        }

        # ─── Alarme und Messaging ───────────────────────────────────────────
        # Alertmanager liefert selbst unter /alertmanager/ aus (--web.route-prefix)
        location = /alertmanager { return 301 /alertmanager/; }
        location /alertmanager/ {
            proxy_pass http://alertmanager:9093;
        }
        # ActiveMQ-Web-Konsole: liegt im Broker unter /admin, Präfix bleibt
        location = /admin { return 301 /admin/; }
        location /admin/ {
            proxy_pass http://activemq:8161;
        }

        # ─── Über den HAProxy, so wie der Kunde einsteigt ───────────────────
        # /lb/mes/api/status                 → Core
        # /lb/mes/fileprocessing/api/status  → FileProcessing
        location = /lb { return 301 /lb/mes/api/status; }
        location /lb/ {
            proxy_pass http://haproxy:8090/;
        }
        # Beim Kunden das SAP-IDOC-Interface, in der Demo der Singleton
        location = /lb-idoc { return 301 /lb-idoc/mes/api/status; }
        location /lb-idoc/ {
            proxy_pass http://haproxy:8095/;
        }

        # ─── Rohe Metriken der JMX Exporter ─────────────────────────────────
        # /metriken/core/metrics  (entspricht :8882/metrics)
        location /metriken/core/ {
            proxy_pass http://core:8888/;
        }
        location /metriken/fileprocessing/ {
            proxy_pass http://fileprocessing:8888/;
        }
        location /metriken/singleton/ {
            proxy_pass http://singleton:8888/;
        }
        # JMX Exporter im ActiveMQ-Broker (entspricht :8886/metrics)
        location /metriken/activemq/ {
            proxy_pass http://activemq:8888/;
        }
        # HAProxy-Exporter (entspricht :8989/metrics)
        location /metriken/haproxy/ {
            proxy_pass http://haproxy:8989/;
        }

        location = /favicon.ico { return 204; }

        # Alles andere: zurück zur Übersicht mit einer klaren Meldung
        location / {
            error_page 404 = @unbekannt;
            return 404;
        }
        location @unbekannt {
            default_type text/html; charset utf-8;
            return 404 '<meta charset="utf-8"><p style="font:16px system-ui;padding:2rem">Unbekannter Pfad. <a href="/">Zur Übersicht</a></p>';
        }
    }
}
